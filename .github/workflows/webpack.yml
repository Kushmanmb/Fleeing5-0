name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'webpack.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/webpack.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'webpack.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/webpack.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
