name: Webpack Build CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'webpack.config.js'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'webpack.config.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  webpack-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build with Webpack
      run: npm run webpack

    - name: Verify webpack output
      run: |
        if [ ! -f "dist/main.js" ]; then
          echo "Error: Webpack bundle not created"
          exit 1
        fi
        echo "Webpack build successful"
